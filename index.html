<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<!-- Page title -->
<title>Quote Card Generator</title>

<!-- External CSS -->
<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- Page title -->
<h1>Quote Card Generator</h1>

<!-- Button used to generate quote + image -->
<button id="btn">Generate Quote</button>

<!-- Spinner container for loading animation -->
<div id="spinner" class="spinner-wrap">

<div class="spinner"></div>
<p>Loading...</p>

</div>

<!-- Status area for errors -->
<p id="status"></p>

<!-- Quote card container -->
<div id="card" class="card">

<!-- Background image -->
<img id="photo" alt="background image">

<!-- Quote overlay -->
<div class="overlay">

<p id="quote-text"></p>

<p id="quote-author"></p>

</div>

</div>

<!-- External JavaScript -->
<script src="script.js"></script>

</body>

</html>
